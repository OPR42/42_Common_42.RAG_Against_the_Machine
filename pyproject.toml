[project]
name = "RAG_Against_the_Machine"
version = "1.0.0"
description = "Retrieval Augmented Generation for vLLM database queries"
requires-python = ">=3.10"
authors = [
  { name = "orobert aka OPR"}
]

dependencies = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "fire>=0.6.0",
    "tqdm>=4.66.0",
    "bm25s>=0.1.8",
    "langchain>=0.1.0",
    "tokenizers>=0.15.0",
    "llama-cpp-python>=0.3.20",
    "fastapi>=0.140.13",
    "uvicorn>=0.51.0",
    "sentence-transformers>=5.0.0",
    "faiss-cpu>=1.10.0",
]

[dependency-groups]
dev = [
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "types-tqdm>=4.66.0.0",
    "pytest>=7.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[tool.hatch.build.targets.wheel]
packages = ["student"]

[project.scripts]
RAG_Against_the_Machine = "student.__main__:main"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[tool.flake8]
max-line-length = 88
extend-ignore = "E203"
exclude = ".git,__pycache__,docs/source/conf.py,old,build,dist"
